spring.application.name=ride-service
server.port=8773

spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:mem:ridedb
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ── Actuator / Prometheus ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# ── Circuit Breaker: driver-service ───────────────────────────────────────
resilience4j.circuitbreaker.instances.driverService.sliding-window-size=5
resilience4j.circuitbreaker.instances.driverService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.driverService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.driverService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.driverService.register-health-indicator=true

# ── Circuit Breaker: pricing-service ──────────────────────────────────────
resilience4j.circuitbreaker.instances.pricingService.sliding-window-size=5
resilience4j.circuitbreaker.instances.pricingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pricingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pricingService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.pricingService.register-health-indicator=true
