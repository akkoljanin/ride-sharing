apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: ride-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
        version: v1
    spec:
      containers:
        - name: users-service
          image: ridesharing/users-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8770
          envFrom:
            - configMapRef:
                name: ride-sharing-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8770
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8770
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: ride-sharing
spec:
  selector:
    app: users-service
  ports:
    - port: 8770
      targetPort: 8770
      name: http
