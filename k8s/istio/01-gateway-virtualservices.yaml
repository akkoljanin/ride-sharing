# Istio Gateway – entry point for all external traffic
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: ride-sharing-gateway
  namespace: ride-sharing
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
# VirtualService – routes external traffic to api-gateway
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: ride-sharing
spec:
  hosts:
    - "*"
  gateways:
    - ride-sharing-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: api-gateway
            port:
              number: 8765
---
# VirtualService – ride-service: traffic splitting and retries
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: ride-service-vs
  namespace: ride-sharing
spec:
  hosts:
    - ride-service
  http:
    - route:
        - destination:
            host: ride-service
            port:
              number: 8773
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: 5xx,connect-failure,retriable-4xx
      timeout: 15s
---
# VirtualService – driver-service
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: driver-service-vs
  namespace: ride-sharing
spec:
  hosts:
    - driver-service
  http:
    - route:
        - destination:
            host: driver-service
            port:
              number: 8771
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: 5xx,connect-failure
      timeout: 10s
---
# VirtualService – pricing-service
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: pricing-service-vs
  namespace: ride-sharing
spec:
  hosts:
    - pricing-service
  http:
    - route:
        - destination:
            host: pricing-service
            port:
              number: 8772
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: 5xx,connect-failure
      timeout: 8s
