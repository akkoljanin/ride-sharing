apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: ride-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
        version: v1
    spec:
      containers:
        - name: pricing-service
          image: ridesharing/pricing-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8772
          envFrom:
            - configMapRef:
                name: ride-sharing-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8772
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8772
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: ride-sharing
spec:
  selector:
    app: pricing-service
  ports:
    - port: 8772
      targetPort: 8772
      name: http
